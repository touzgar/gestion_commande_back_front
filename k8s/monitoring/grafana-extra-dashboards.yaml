apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-extra-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  kubernetes-summary.json: |
    {
      "title": "Kubernetes Summary - Gestion Commande",
      "refresh": "10s",
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "type": "stat",
          "title": "Total Pods",
          "targets": [
            {
              "expr": "count(kube_pod_info)",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 }
        },
        {
          "type": "stat",
          "title": "Running Pods",
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{phase=\"Running\"})",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 }
        },
        {
          "type": "stat",
          "title": "Deployments Available",
          "targets": [
            {
              "expr": "sum(kube_deployment_status_replicas_available)",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 }
        },
        {
          "type": "stat",
          "title": "Services",
          "targets": [
            {
              "expr": "count(kube_service_info)",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 }
        },
        {
          "type": "timeseries",
          "title": "CPU Usage",
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total[5m]))",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 }
        },
        {
          "type": "timeseries",
          "title": "Memory Usage",
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes)",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 }
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-app-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  gestion-commande-app.json: |
    {
      "title": "Gestion Commande Application",
      "refresh": "10s",
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "type": "stat",
          "title": "Backend Pod Status",
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{pod=~\"backend.*\",phase=\"Running\"})",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 0 }
        },
        {
          "type": "stat",
          "title": "Frontend Pods Running",
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{pod=~\"frontend.*\",phase=\"Running\"})",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 0 }
        },
        {
          "type": "stat",
          "title": "Backend Restarts",
          "targets": [
            {
              "expr": "sum(kube_pod_container_status_restarts_total{pod=~\"backend.*\"})",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 0 }
        },
        {
          "type": "timeseries",
          "title": "Backend CPU Usage",
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{pod=~\"backend.*\"}[5m]))",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 }
        },
        {
          "type": "timeseries",
          "title": "Frontend CPU Usage",
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{pod=~\"frontend.*\"}[5m]))",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 }
        },
        {
          "type": "timeseries",
          "title": "Backend Memory Usage",
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{pod=~\"backend.*\"})",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 }
        },
        {
          "type": "timeseries",
          "title": "Frontend Memory Usage",
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{pod=~\"frontend.*\"})",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 }
        }
      ]
    }
